name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release Version (e.g., v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: AnkiImage2Card-Linux
            asset_name: AnkiImage2Card-Linux.tar.gz
            bin_path: zig-out/bin/AnkiImage2Card
            assets_path: zig-out/bin/assets
          - os: windows-latest
            artifact_name: AnkiImage2Card-Windows
            asset_name: AnkiImage2Card-Windows.zip
            bin_path: zig-out/bin/AnkiImage2Card.exe
            assets_path: zig-out/bin/assets
          - os: macos-latest
            artifact_name: AnkiImage2Card-MacOS
            asset_name: AnkiImage2Card-MacOS.zip
            bin_path: zig-out/bin/AnkiImage2Card
            assets_path: zig-out/bin/assets

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.0

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev libx11-dev libxext-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev tesseract-ocr libtesseract-dev libleptonica-dev libwebp-dev pkg-config libasound2-dev libspeechd-dev libmecab-dev mecab-ipadic-utf8 libsqlite3-dev
          wget https://github.com/libsdl-org/SDL/releases/download/preview-3.1.3/SDL3-3.1.3.tar.xz
          tar -xf SDL3-3.1.3.tar.xz
          cd SDL3-3.1.3
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          cmake --build . --config Release
          sudo cmake --install .
          echo "LD_LIBRARY_PATH=/usr/local/lib:/usr/local/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Install macOS Dependencies
        if: runner.os == 'macOS'
        run: |
          brew install tesseract mecab mecab-ipadic sdl3 pkg-config

      - name: Install Windows Dependencies
        if: runner.os == 'Windows'
        run: |
          choco install -y pkgconfiglite
          vcpkg install tesseract:x64-windows leptonica:x64-windows libwebp:x64-windows mecab:x64-windows
          $SDL_URL = "https://github.com/libsdl-org/SDL/releases/download/preview-3.1.3/SDL3-devel-3.1.3-VC.zip"
          Invoke-WebRequest -Uri $SDL_URL -OutFile SDL3.zip
          Expand-Archive SDL3.zip -DestinationPath C:\SDL3

          # HACK: Move the x64 libs to the root /lib directory so Zig's --search-prefix finds them automatically
          Copy-Item -Path "C:\SDL3\SDL3-3.1.3\lib\x64\*" -Destination "C:\SDL3\SDL3-3.1.3\lib\" -Recurse

          $env:PATH += ";C:\SDL3\SDL3-3.1.3\lib\x64"
          echo "PATH=$env:PATH" >> $env:GITHUB_ENV

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            rm -rf ~/.cache/zig .zig-cache && zig build -Doptimize=ReleaseFast -fno-reference-trace --search-prefix /usr/local
          else
            rm -rf ~/.cache/zig .zig-cache && zig build -Doptimize=ReleaseFast -fno-reference-trace --search-prefix /opt/homebrew
          fi

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          export CFLAGS=-IC:/SDL3/SDL3-3.1.3/include
          export LDFLAGS=-LC:/SDL3/SDL3-3.1.3/lib
          export PKG_CONFIG_PATH=C:/vcpkg/installed/x64-windows/lib/pkgconfig
          rm -rf ~/.cache/zig .zig-cache && zig build -Dtarget=x86_64-windows-gnu -Doptimize=ReleaseFast -fno-reference-trace --search-prefix "C:/SDL3/SDL3-3.1.3" --search-prefix "C:/vcpkg/installed/x64-windows"
        shell: bash

      - name: Prepare Artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "${{ matrix.bin_path }}" dist/
          cp -r "${{ matrix.assets_path }}" dist/
          cd dist
          if [ "${{ runner.os }}" == "Linux" ]; then
            tar -czvf ../${{ matrix.asset_name }} *
          else
            zip -r ../${{ matrix.asset_name }} *
          fi

      - name: Prepare Artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item -Path "${{ matrix.bin_path }}" -Destination dist\

          $assetsSource = "${{ matrix.assets_path }}"

          if (Test-Path $assetsSource) {
              Copy-Item -Path $assetsSource -Destination dist\ -Recurse
          }

          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.asset_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_name }}

  create_release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          generate_release_notes: true
          files: |
            AnkiImage2Card-Linux/AnkiImage2Card-Linux.tar.gz
            AnkiImage2Card-Windows/AnkiImage2Card-Windows.zip
            AnkiImage2Card-MacOS/AnkiImage2Card-MacOS.zip
