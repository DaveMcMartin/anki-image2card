name: PR Build Check

on:
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.0

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev libx11-dev libxext-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev tesseract-ocr libtesseract-dev libleptonica-dev libwebp-dev pkg-config libasound2-dev libspeechd-dev libmecab-dev mecab-ipadic-utf8 libsqlite3-dev
          wget https://github.com/libsdl-org/SDL/releases/download/preview-3.1.3/SDL3-3.1.3.tar.xz
          tar -xf SDL3-3.1.3.tar.xz
          cd SDL3-3.1.3
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          cmake --build . --config Release
          sudo cmake --install .
          echo "LD_LIBRARY_PATH=/usr/local/lib:/usr/local/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Install macOS Dependencies
        if: runner.os == 'macOS'
        run: |
          brew install tesseract mecab mecab-ipadic sdl3 pkg-config

      - name: Install Windows Dependencies
        if: runner.os == 'Windows'
        run: |
          choco install -y tesseract
          $SDL_URL = "https://github.com/libsdl-org/SDL/releases/download/preview-3.1.3/SDL3-devel-3.1.3-mingw.zip"
          Invoke-WebRequest -Uri $SDL_URL -OutFile SDL3.zip
          Expand-Archive SDL3.zip -DestinationPath C:\SDL3
          $env:PATH += ";C:\SDL3\SDL3-3.1.3\x86_64-w64-mingw32\bin"
          echo "PATH=$env:PATH" >> $env:GITHUB_ENV

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            zig build -Doptimize=ReleaseFast -fno-reference-trace --search-prefix /usr/local
          else
            zig build -Doptimize=ReleaseFast -fno-reference-trace --search-prefix /opt/homebrew
          fi

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          set CFLAGS=-IC:/SDL3/SDL3-3.1.3/x86_64-w64-mingw32/include
          set LDFLAGS=-LC:/SDL3/SDL3-3.1.3/x86_64-w64-mingw32/lib
          zig build -Doptimize=ReleaseFast -fno-reference-trace --search-prefix "C:/SDL3/SDL3-3.1.3/x86_64-w64-mingw32"
