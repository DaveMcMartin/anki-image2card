name: PR Build Check

on:
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.0

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev libx11-dev libxext-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev tesseract-ocr libtesseract-dev libleptonica-dev pkg-config libasound2-dev libspeechd-dev libmecab-dev mecab-ipadic-utf8 libsqlite3-dev

      - name: Install macOS Dependencies
        if: runner.os == 'macOS'
        run: brew install tesseract mecab mecab-ipadic

      - name: Install Windows Dependencies
        if: runner.os == 'Windows'
        run: |
          choco install -y tesseract

      - name: Build
        run: zig build
